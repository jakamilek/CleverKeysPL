name: Experimental runtime build
# Experimental branch verification: build + pure JVM tests only.

on:
  push:
    branches:
      - exp/context-reranking-runtime-2026-10-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and pure tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run pure JVM tests
        run: ./gradlew runPureTests --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-runtime-debug-apk
          path: build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
